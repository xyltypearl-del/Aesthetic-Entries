<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>美学卡片 · flomo 式网状联想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
:root{
 /* Claude 气质：暖米白底 + 赤陶橙强调 + 深暖灰文字 */
 --bg:#F5F4EF;--paper:#FFFFFF;--ink:#2B2A27;--muted:#7C786E;--line:#E6E2D8;
 --accent:#C15F3C;--accent-2:#D97757;--accent-soft:#F9EFE8;--shadow:0 1px 2px rgba(60,45,30,.04),0 5px 16px rgba(60,45,30,.05);
 --font-en:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
 --font-serif:'Lora',serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter','LXGW WenKai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.65;font-size:14px}
.wrap{max-width:1480px;margin:0 auto;padding:28px 24px 70px}
header h1{font-family:var(--font-serif),'LXGW WenKai',serif;font-size:27px;margin:0 0 6px;font-weight:600;letter-spacing:.2px}
header p{margin:0;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 16px}
input,select{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(193,95,60,.12)}
input.search{width:260px}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.count{margin-left:auto;font-size:12px;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.left{min-width:0}
.view{display:none}.view.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.card:hover{transform:translateY(-2px);border-color:#d9c5b5}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(193,95,60,.13)}
.card h3{margin:0;font-size:15px;font-weight:650;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.card h3 small{font-size:12px;color:var(--muted);font-weight:400}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}
.chip{font-size:10px;color:#9c5739;background:var(--accent-soft);border-radius:20px;padding:2px 8px;cursor:pointer}
.chip.fam{color:#fff;background:var(--fc,#888)}
.thumb{width:100%;height:112px;object-fit:cover;border-radius:10px;background:#ece9df;display:block;margin-bottom:10px}
.def{font-size:13px;color:#514e46;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.graph-shell{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
svg{display:block;width:100%;height:660px;cursor:grab}
svg:active{cursor:grabbing}
.edge{stroke:#ddd9cf;stroke-width:1.2;opacity:.8}
.edge.hi{stroke:var(--accent);stroke-width:2.4;opacity:1}
.node{cursor:pointer}
.node circle{stroke:#fff;stroke-width:1.8}
.node text{font-size:10px;fill:#3a3833;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.node.sel circle{stroke:var(--ink);stroke-width:3}
.node.dim{opacity:.16}
.node.hi circle{stroke:var(--accent);stroke-width:2.6}
.side{position:sticky;top:22px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);max-height:calc(100vh - 44px);overflow:auto}
.side h2{font-family:var(--font-serif),'LXGW WenKai',serif;font-size:18px;margin:0 0 3px}
.side .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
.side img{width:100%;height:140px;object-fit:cover;border-radius:10px;background:#ece9df}
.side p{font-size:13px;margin:10px 0}
.side .label{font-size:11px;color:var(--muted);letter-spacing:.4px;margin:14px 0 4px}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{font-size:11px;padding:5px 9px;border-radius:18px}
.hint{color:var(--muted);font-size:13px}
@media(max-width:1000px){.main{grid-template-columns:1fr}.side{position:static;max-height:none}}

/* ===== 纠错编辑层 ===== */
button.edit-on{background:var(--accent);border-color:var(--accent);color:#fff}
#editBanner{display:none;margin:0 0 14px;padding:10px 14px;background:var(--accent-soft);border:1px solid #e8c9b8;color:#9c5739;border-radius:12px;font-size:12px}
#editBanner.on{display:block}
.edit-panel{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.edit-panel textarea{width:100%;font-size:12px;padding:8px 10px;margin-top:4px;min-height:58px;resize:vertical;line-height:1.5}
.edit-panel .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.edit-panel .row button{font-size:12px;padding:7px 11px}
.edit-panel .row a{font-size:11px;color:var(--accent);text-decoration:underline}
.diff-tag{font-size:10px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:6px}
/* 多图轮播 */
.carousel-main{position:relative;width:100%;height:150px;border-radius:10px;overflow:hidden;background:#ece9df}
.side .carousel-main img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;line-height:28px;text-align:center;cursor:pointer;z-index:2;padding:0}
.carousel-btn:hover{background:rgba(0,0,0,.72)}
.carousel-btn.prev{left:8px}.carousel-btn.next{right:8px}
.carousel-cap{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-size:10px;pointer-events:none}
.carousel-dots{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.carousel-dot{width:8px;height:8px;border-radius:50%;border:0;background:#ccc;cursor:pointer;padding:0}
.carousel-dot.on{background:var(--accent);transform:scale(1.25)}
.carousel-count{text-align:center;font-size:11px;color:var(--muted);margin-top:5px}
.thumb-wrap{position:relative}
.img-badge{position:absolute;right:8px;bottom:18px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;padding:1px 7px;border-radius:10px}
/* 多图编辑 */
.img-edit-row{border:1px solid var(--line);border-radius:10px;padding:9px;margin-top:8px;background:#fdfcf9}
.img-edit-row .img-no{font-size:11px;color:var(--muted)}
.img-edit-row .erow{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.img-edit-row input{flex:1;min-width:0;font-size:12px;padding:7px 9px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.img-edit-row .erow input{margin-top:0}
.img-edit-row .paste-btn,.img-edit-row .del-btn{font-size:11px;padding:6px 9px;flex:none}
.img-edit-row .del-btn{color:#b91c1c;border-color:#fecaca}
.add-img{margin-top:8px;font-size:12px}
</style>
</head>

function layout(nodes, edges){
  const W=1000,H=700, idx={};
  nodes.forEach((n,i)=>{idx[n.name]=i;const a=i*2.399963;const r=70+Math.sqrt(i)*30;n.x=W/2+Math.cos(a)*r;n.y=H/2+Math.sin(a)*r;n.vx=0;n.vy=0;n.r=7+Math.min(n.deg,8)*0.75;});
  for(let it=0;it<240;it++){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y;let d2=Math.max(dx*dx+dy*dy,36);
      const f=1600/d2;const d=Math.sqrt(d2);dx/=d;dy/=d;
      a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;

    edges.forEach(([na,nb])=>{const a=nodes[idx[na]],b=nodes[idx[nb]];if(!a||!b)return;
      let dx=b.x-a.x,dy=b.y-a.y;const d=Math.max(Math.sqrt(dx*dx+dy*dy),1);
      const f=(d-105)*0.006;dx/=d;dy/=d;
      a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
    });
    nodes.forEach(n=>{n.vx+=(W/2-n.x)*0.0007;n.vy+=(H/2-n.y)*0.0007;n.vx*=0.84;n.vy*=0.84;n.x=Math.max(35,Math.min(W-35,n.x+n.vx));n.y=Math.max(28,Math.min(H-28,n.y+n.vy));});
  }
}

  document.getElementById('side').innerHTML=`
    <h2>${esc(e.name)} <span style="font-size:12px;color:var(--muted);font-weight:400">${esc(e.cn)}</span></h2>
    <div class="sub">${esc(e.family)} · ${esc(e.era||'')} · ${esc(e.mood||'')}</div>
    <div class="carousel-main">
      <img id="carImg" src="${esc(e.img)}" alt="${esc(e.img_desc)}">
      <button class="carousel-btn prev" id="carPrev" aria-label="上一张">‹</button>
      <button class="carousel-btn next" id="carNext" aria-label="下一张">›</button>
      <div class="carousel-cap" id="carCap"></div>
    </div>
    <div class="carousel-count" id="carCount"></div>
    <div class="carousel-dots" id="carDots"></div>
    <p>${esc(e.def)}</p>
    <div class="label">判别要点</div><p>${esc(e.judge||'—')}</p>
    <div class="label">血缘关系</div><p style="color:var(--muted);font-size:12px">${esc(e.relation||'—')}</p>
    <div class="label">相关笔记 · ${e.related.length}</div>
    <div class="rel">${e.related.map(n=>`<button data-rel="${esc(n)}">${esc(byName[n]?byName[n].cn:n)}</button>`).join('')}</div>`;
  document.querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>select(b.dataset.rel));
  const pv=document.getElementById('carPrev'), nx=document.getElementById('carNext');
  if(pv) pv.onclick=()=>{const n=e.imgs.length;carIndex=(carIndex-1+n)%n;renderCarousel(e);};
  if(nx) nx.onclick=()=>{const n=e.imgs.length;carIndex=(carIndex+1)%n;renderCarousel(e);};
  initCarousel(e);
  if(editMode) renderEditPanel(e);
}
function setView(v){
  state.view=v;
  document.getElementById('btnCards').classList.toggle('active',v==='cards');
  document.getElementById('btnGraph').classList.toggle('active',v==='graph');
  document.getElementById('cardsView').classList.toggle('on',v==='cards');
  document.getElementById('graphView').classList.toggle('on',v==='graph');
  if(v==='graph')renderGraph(); else renderCards();
}
document.getElementById('q').oninput=ev=>{state.q=ev.target.value;state.view==='graph'?renderGraph():renderCards();};
document.getElementById('family').onchange=ev=>{state.family=ev.target.value;state.view==='graph'?renderGraph():renderCards();};
document.getElementById('tag2').onchange=ev=>{state.tag2=ev.target.value;state.view==='graph'?renderGraph():renderCards();};
document.getElementById('btnCards').onclick=()=>setView('cards');
document.getElementById('btnGraph').onclick=()=>setView('graph');
document.getElementById('btnReset').onclick=()=>{
  state.q='';state.family='';state.tag2='';state.selected=null;
  document.getElementById('q').value='';document.getElementById('family').value='';document.getElementById('tag2').value='';
  setView(state.view);
  document.getElementById('side').innerHTML='<p class="hint">点一张卡片开始。右侧会像 flomo 的「相关笔记」一样，按共享标签与血缘关系推荐相邻卡片。</p>';
};
document.getElementById('btnWalk').onclick=()=>{
  const pool=visible();if(!pool.length)return;
  let next;
  if(!state.selected || state.walk!==state.selected){next=pool[Math.floor(Math.random()*pool.length)].name;}
  else{const cand=byName[state.selected].related.filter(n=>showVisible(n));next=cand.length?cand[Math.floor(Math.random()*cand.length)]:pool[Math.floor(Math.random()*pool.length)].name;}
  state.walk=next;select(next);
  if(state.view!=='graph')document.querySelector(`.card[data-name="${CSS.escape(next)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});
};
function showVisible(n){return visible().some(e=>e.name===n);}
DATA.families.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;document.getElementById('family').appendChild(o);});
DATA.tags2.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;document.getElementById('tag2').appendChild(o);});

/* ===== 修正层 ===== */
function stripMeta(j){ for(const k of Object.keys(j||{})) if(k.charAt(0)==='_') delete j[k]; return j||{}; }
function applyOverrides(){
  for(const e of entries){
    const o=overrides[e.name]||{}, base=ORIG[e.name]||{};
    for(const k of EDIT_KEYS) e[k]=(o[k]!=null && o[k]!=='') ? o[k] : base[k];
    let imgs;
    if(Array.isArray(o.imgs) && o.imgs.length){
      imgs=o.imgs.filter(x=>x&&x.url).map(x=>({url:x.url,desc:x.desc||''}));
    }else if(o.img){
      imgs=[{url:o.img,desc:o.img_desc||''}];
    }else{
      imgs=[{url:e.img,desc:e.img_desc||''}];
    }
    e.imgs=imgs.length?imgs:[{url:base.img,desc:base.img_desc||''}];
  }
}
function loadLocalOverrides(){
  try{ overrides=stripMeta(JSON.parse(localStorage.getItem(OV_KEY)||'{}')); }catch(err){ overrides={}; }
  applyOverrides();
}
function saveLocalOverrides(){ try{ localStorage.setItem(OV_KEY,JSON.stringify(overrides)); }catch(err){} }
async function loadRemoteOverrides(){
  if(location.protocol==='file:') return false;
  try{
    const r=await fetch('./overrides.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return false;
    const local=overrides;
    overrides=Object.assign({},stripMeta(await r.json()),local);
    applyOverrides();
    return true;
  }catch(err){ return false; }
}
function toast(msg){
  let t=document.getElementById('_toast');
  if(!t){
    t=document.createElement('div'); t.id='_toast';
    t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b2a27;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.2);transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(toast._t); toast._t=setTimeout(()=>{t.style.opacity='0';},2600);
}
function exportOverrides(){
  const blob=new Blob([JSON.stringify(overrides,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='overrides.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('已导出 overrides.json');
}

/* ===== 粘贴 ===== */
function pickUrl(text){
  if(!text) return '';
  const t=String(text).trim();
  if(/^https?:\/\/\S+$/i.test(t)) return t;
  let m=t.match(/!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/i); if(m) return m[1];
  m=t.match(/https?:\/\/[^\s"'<>)]+/i); return m?m[0]:t;
}
async function pasteInto(input){
  try{
    const txt=await navigator.clipboard.readText();
    const url=pickUrl(txt);
    if(!url){ toast('剪贴板里没有找到链接'); return; }
    input.value=url; input.focus(); toast('已粘贴图片链接');
  }catch(err){
    toast('无法读取剪贴板，请点输入框后直接按 Ctrl+V');
  }
}
document.addEventListener('paste', ev=>{
  if(!editMode || !state.selected) return;
  const tag=(ev.target && ev.target.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA') return;   // 输入框内交给原生粘贴
  const first=document.querySelector('#imgEditorList .edUrl');
  if(!first) return;
  ev.preventDefault();
  const txt=(ev.clipboardData && ev.clipboardData.getData('text')) || '';
  const url=pickUrl(txt);
  if(url){ first.value=url; first.focus(); toast('已粘贴到第一张图片'); }
});

/* ===== 轮播 ===== */
function renderCarousel(e){
  const imgs=(e.imgs&&e.imgs.length)?e.imgs:[{url:e.img,desc:e.img_desc||''}];
  if(carIndex>=imgs.length) carIndex=0;
  const cur=imgs[carIndex];
  const img=document.getElementById('carImg'); if(img){ img.src=cur.url; img.alt=cur.desc||''; }
  const cap=document.getElementById('carCap'); if(cap) cap.textContent=cur.desc||'';
  const cnt=document.getElementById('carCount'); if(cnt) cnt.textContent=imgs.length>1?(carIndex+1)+' / '+imgs.length:'';
  const multi=imgs.length>1;
  const pv=document.getElementById('carPrev'), nx=document.getElementById('carNext');
  if(pv) pv.style.display=multi?'':'none';
  if(nx) nx.style.display=multi?'':'none';
  const dots=document.getElementById('carDots');
  if(dots){
    dots.innerHTML=multi?imgs.map((_,i)=>'<button class="carousel-dot '+(i===carIndex?'on':'')+'" data-i="'+i+'"></button>').join(''):'';
    dots.querySelectorAll('.carousel-dot').forEach(d=>d.onclick=()=>{carIndex=+d.dataset.i;renderCarousel(e);});
  }
}
function initCarousel(e){ carIndex=0; renderCarousel(e); }

/* ===== 多图编辑 ===== */
function imgEditRow(i, im){
  return '<div class="img-edit-row" data-idx="'+i+'">'
    + '<div class="img-no">图片 '+(i+1)+'</div>'
    + '<div class="erow"><input class="edUrl" value="'+esc(im.url||'')+'" placeholder="图片直链 URL（Ctrl+V 粘贴）">'
    + '<button class="paste-btn" type="button" title="从剪贴板粘贴图片链接">📋 粘贴</button>'
    + '<button class="del-btn" type="button" title="删除这张">✕</button></div>'
    + '<input class="edDesc" value="'+esc(im.desc||'')+'" placeholder="图片说明 / 来源（可选）"></div>';
}
function bindImgRows(panel){
  panel.querySelectorAll('.paste-btn').forEach(b=>b.onclick=()=>pasteInto(b.closest('.img-edit-row').querySelector('.edUrl')));
  panel.querySelectorAll('.del-btn').forEach(b=>b.onclick=()=>{
    const list=document.getElementById('imgEditorList');
    if(list.children.length<=1){ toast('至少保留一张图片'); return; }
    b.closest('.img-edit-row').remove();
    [...list.children].forEach((r,i)=>{ r.dataset.idx=i; r.querySelector('.img-no').textContent='图片 '+(i+1); });
  });
}
function saveOne(name){
  const o={}, list=document.getElementById('imgEditorList'), imgs=[];
  if(list) [...list.children].forEach(r=>{
    const url=r.querySelector('.edUrl').value.trim(), desc=r.querySelector('.edDesc').value.trim();
    if(url) imgs.push({url,desc});
  });
  if(imgs.length){ o.imgs=imgs; o.img=imgs[0].url; o.img_desc=imgs[0].desc; }
  const def=document.getElementById('edDef').value.trim();
  if(def) o.def=def;
  if(Object.keys(o).length) overrides[name]=o; else delete overrides[name];
  saveLocalOverrides(); applyOverrides(); renderCards(); select(name);
  toast('已保存「'+name+'」的修正'+(imgs.length>1?'（'+imgs.length+' 张图）':''));
}
function revertOne(name){
  delete overrides[name]; saveLocalOverrides(); applyOverrides(); renderCards(); select(name);
  toast('已还原「'+name+'」为默认版本');
}
function renderEditPanel(e){
  const side=document.getElementById('side');
  const o=overrides[e.name]||{};
  const imgs=(e.imgs&&e.imgs.length)?e.imgs:[{url:e.img,desc:e.img_desc||''}];
  const gh = REPO
    ? '<a href="https://github.com/'+REPO+'/edit/main/overrides.json" target="_blank" rel="noopener">在 GitHub 改 overrides.json ↗</a>'
      + '<a href="https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('[图片纠正] '+e.name)+'&body='+encodeURIComponent('词条：'+e.name+'（'+e.cn+'）\n当前图片：'+(imgs[0]?imgs[0].url:'')+'\n建议改成：')+'" target="_blank" rel="noopener">提交 Issue 反馈 ↗</a>'
    : '<span style="font-size:11px;color:var(--muted)">在脚本里填写 REPO 后，这里会出现 GitHub 编辑与 Issue 入口</span>';
  const panel=document.createElement('div');
  panel.className='edit-panel';
  panel.innerHTML=''
    + '<div class="label" style="margin-top:16px;border-top:1px dashed var(--line);padding-top:14px">✎ 纠错模式 · 修改这张卡片</div>'
    + '<div class="label">代表图片（可多张，详情里点箭头/圆点切换）</div>'
    + '<div id="imgEditorList">'+imgs.map((im,i)=>imgEditRow(i,im)).join('')+'</div>'
    + '<button id="edAddImg" class="add-img">＋ 添加一张图片</button>'
    + '<div class="label" style="margin-top:12px">一句话定义</div>'
    + '<textarea id="edDef">'+esc(o.def!=null?o.def:e.def)+'</textarea>'
    + '<div class="row"><button id="edSave" class="active">保存修正</button><button id="edRevert">还原这张</button></div>'
    + '<div class="row">'+gh+'</div>';
  side.appendChild(panel);
  bindImgRows(panel);
  document.getElementById('edAddImg').onclick=()=>{
    const list=document.getElementById('imgEditorList');
    const wrap=document.createElement('div');
    wrap.innerHTML=imgEditRow(list.children.length,{url:'',desc:''});
    list.appendChild(wrap.firstElementChild);
    bindImgRows(panel);
  };
  document.getElementById('edSave').onclick=()=>saveOne(e.name);
  document.getElementById('edRevert').onclick=()=>revertOne(e.name);
}

/* ===== 事件 ===== */
document.getElementById('btnEditMode').onclick=()=>{
  editMode=!editMode;
  document.getElementById('btnEditMode').classList.toggle('edit-on',editMode);
  document.getElementById('editBanner').classList.toggle('on',editMode);
  if(state.selected) select(state.selected); else toast('纠错模式已开启：点任意卡片开始改图');
};
document.getElementById('btnExport').onclick=exportOverrides;
document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange=ev=>{
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=stripMeta(JSON.parse(rd.result));
      overrides=Object.assign({},overrides,j); saveLocalOverrides(); applyOverrides();
      renderCards(); if(state.selected) select(state.selected);
      toast('已导入 '+Object.keys(j).length+' 条修正');
    }catch(err){ toast('导入失败：JSON 格式错误'); }
  };
  rd.readAsText(f); ev.target.value='';
};

/* ===== 启动 ===== */
loadLocalOverrides();
renderCards();
loadRemoteOverrides().then(changed=>{
  if(changed){ renderCards(); if(state.selected) select(state.selected); }
});
</script>
</body>
